<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>About Page</title>
</head>
<body>
<a href="home">Main Home Editor</a>
<link rel="stylesheet" th:href="@{/css/main-page.css}">
<br>

<div>
    <form
            th:action="@{/about-page/carousel-text}"
            method="POST"
            th:object="${carouselText}"
    >
        <h2>Edit Carousel Text </h2>
        <h3>Text: </h3>
        <input type="text"
               th:field="*{cards[0].word}"
        />
        <button name="lang" value="en" type="submit">Submit</button>
    </form>

    <div dir="rtl" lang="ar">
        <form
                th:action="@{/about-page/carousel-text}"
                method="POST"
                th:object="${carouselTextAr}"
        >
            <h2>تعديل نص السلايدر</h2>
            <h3>النص:</h3>

            <input type="text"
                   th:field="*{cards[0].word}"
            />

            <button name="lang" value="ar" type="submit">إرسال</button>
        </form>
    </div>

    <form
            th:action="@{/about-page/carousel-images}"
            method="POST"
            th:object="${carouselImages}"
            enctype="multipart/form-data"
    >
        <h2>Edit Carousel Images </h2>
        <div th:each="card, iterStat : *{cards}">
            <span>Image: </span>
            <input
                    type="file"
                    th:field="*{cards[__${iterStat.index}__].image.image}"
            />
            <input
                    type="checkbox"
                    th:field="*{cards[__${iterStat.index}__].visible}"
            />
            <span>Hide Image</span>
        </div>
        <button type="submit" name="action" value="add">Add New Image</button>
        <button type="submit" name="action" value="submit">Submit</button>
    </form>

    <div dir="rtl" lang="ar">

        <form
                th:action="@{/about-page/carousel-images}"
                method="POST"
                th:object="${carouselImagesAr}"
                enctype="multipart/form-data"
        >
            <h2>تعديل صور السلايدر</h2>

            <div th:each="card, iterStat : *{cards}">
                <span>الصورة: </span>
                <input
                        type="file"
                        th:field="*{cards[__${iterStat.index}__].image.image}"
                />
                <input
                        type="checkbox"
                        th:field="*{cards[__${iterStat.index}__].visible}"
                />
                <span>إخفاء الصورة</span>
            </div>

            <button type="submit" name="action" value="add">إضافة صورة</button>
            <button type="submit" name="action" value="submit">إرسال</button>
            <input type="hidden" name="lang" value="ar">
        </form>

    </div>

    <form
            th:action="@{/about-page/about-us-data}"
            method="POST"
            th:object="${aboutUsData}"
            enctype="multipart/form-data"
    >
        <h2>Edit About Us Data </h2>
        <div th:each="card, iterStat : *{cards}">
            <span>Header: </span>
            <input
                    type="text"
                    th:field="*{cards[__${iterStat.index}__].header}"
            />
            <span>Description: </span>
            <input
                    type="text"
                    th:field="*{cards[__${iterStat.index}__].description}"
            />
            <span>Image Upload: </span>
            <input
                    type="file"
                    th:field="*{cards[__${iterStat.index}__].image.image}"
            />
            <input
                    type="checkbox"
                    th:field="*{cards[__${iterStat.index}__].visible}"
            />
            <span>Hide Card</span>
        </div>
        <button type="submit" name="action" value="add">Add New Card</button>
        <button type="submit" name="action" value="submit">Submit</button>
    </form>
    <div dir="rtl" lang="ar">

        <form
                th:action="@{/about-page/about-us-data}"
                method="POST"
                th:object="${aboutUsDataAr}"
                enctype="multipart/form-data"
        >
            <h2>تعديل بيانات من نحن</h2>

            <div th:each="card, iterStat : *{cards}">
                <span>العنوان: </span>
                <input type="text"
                       th:field="*{cards[__${iterStat.index}__].header}"
                />

                <span>الوصف: </span>
                <input type="text"
                       th:field="*{cards[__${iterStat.index}__].description}"
                />

                <span>رفع صورة: </span>
                <input type="file"
                       th:field="*{cards[__${iterStat.index}__].image.image}"
                />

                <input type="checkbox"
                       th:field="*{cards[__${iterStat.index}__].visible}"
                />
                <span>إخفاء البطاقة</span>
            </div>

            <button type="submit" name="action" value="add">إضافة بطاقة</button>
            <button type="submit" name="action" value="submit">إرسال</button>
            <input type="hidden" name="lang" value="ar">
        </form>

    </div>
</div>

</body>
</html>
