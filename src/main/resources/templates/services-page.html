<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Services Page</title>
</head>
<body>

<a href="home">Main Home Editor</a>
<link rel="stylesheet" th:href="@{/css/main-page.css}">
<br>

<div>

    <!-- ================= EN: Header ================= -->
    <form
            th:action="@{/services-page/service-section}"
            method="POST"
            th:object="${servicesHeader}"
    >
        <h2>Edit Services Header</h2>

        <h3>Title:</h3>
        <input type="text" th:field="*{cards[0].word}" />

        <h3>Description:</h3>
        <input type="text" th:field="*{cards[1].word}" />

        <button name="lang" value="en" type="submit">Submit</button>
    </form>

    <!-- ================= AR: Header ================= -->
    <div dir="rtl" lang="ar">

        <form
                th:action="@{/services-page/service-section}"
                method="POST"
                th:object="${servicesHeaderAr}"
        >
            <h2>تعديل عنوان قسم الخدمات</h2>

            <h3>العنوان:</h3>
            <input type="text" th:field="*{cards[0].word}" />

            <h3>الوصف:</h3>
            <input type="text" th:field="*{cards[1].word}" />

            <button name="lang" value="ar" type="submit">إرسال</button>
        </form>

    </div>

    <!-- ================= EN: Body ================= -->
    <form
            th:action="@{/services-page/services-body}"
            method="POST"
            th:object="${servicesBody}"
            enctype="multipart/form-data"
    >
        <h2>Edit Services Body</h2>

        <div th:each="card, iterStat : *{cards}">
            <h3>Title:</h3>
            <input type="text"
                   th:field="*{cards[__${iterStat.index}__].title}" />

            <h3>Description:</h3>
            <input type="text"
                   th:field="*{cards[__${iterStat.index}__].description}" />

            <h3>Image Upload:</h3>
            <input type="file"
                   th:field="*{cards[__${iterStat.index}__].image.image}" />

            <input type="checkbox"
                   th:field="*{cards[__${iterStat.index}__].visible}" />
            <span>Hide Image</span>
        </div>

        <button type="submit" name="action" value="add">Add New Image</button>
        <button type="submit" name="action" value="submit">Submit</button>
    </form>

    <!-- ================= AR: Body ================= -->
    <div dir="rtl" lang="ar">

        <form
                th:action="@{/services-page/services-body}"
                method="POST"
                th:object="${servicesBodyAr}"
                enctype="multipart/form-data"
        >
            <h2>تعديل محتوى الخدمات</h2>

            <div th:each="card, iterStat : *{cards}">
                <h3>العنوان:</h3>
                <input type="text"
                       th:field="*{cards[__${iterStat.index}__].title}" />

                <h3>الوصف:</h3>
                <input type="text"
                       th:field="*{cards[__${iterStat.index}__].description}" />

                <h3>رفع صورة:</h3>
                <input type="file"
                       th:field="*{cards[__${iterStat.index}__].image.image}" />

                <input type="checkbox"
                       th:field="*{cards[__${iterStat.index}__].visible}" />
                <span>إخفاء الصورة</span>
            </div>

            <button type="submit" name="action" value="add">إضافة صورة</button>
            <button type="submit" name="action" value="submit">إرسال</button>
            <input type="hidden" name="lang" value="ar">
        </form>

    </div>

</div>

</body>
</html>
