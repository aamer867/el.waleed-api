<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Add New Card</title>
</head>
<body>
    <form
            method="POST"
            th:object="${card}"
            enctype="multipart/form-data"
    >

        <h3>Edit the title</h3>
        <input
                type="text"
                th:field="*{title}"
        >

        <h3>Edit the Description</h3>
        <input
                type="text"
                th:field="*{description}"
        >

        <h3>Upload the image</h3>
        <input
                type="file"
                th:field="*{imageFile}"
        >

        <button type="submit">Submit</button>

    </form>
</body>
</html>
