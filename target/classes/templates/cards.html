<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Cards</title>
</head>
<body>
    <form
            method="post"
            th:object="${cards}"
            enctype="multipart/form-data"
    >
        <div th:each="card, stat : ${cards.getCards()}">
            <input
                    type="text"
                    th:placeholder="${card.getTitle()}"
                    th:field="*{cards[__${stat.index}__].title}"
            >
            <input
                    type="text"
                    th:placeholder="${card.getDescription()}"
                    th:field="*{cards[__${stat.index}__].description}"
            >
            <input
                    type="file"
                    th:field="*{cards[__${stat.index}__].imageFile}"
                    th:placeholder="${card.getImageFile().getOriginalFilename()}"
            >
            <label>Show The Card: </label>
            <input
                    type="checkbox"
                    th:field="*{cards[__${stat.index}__].selected}"
            >
        </div>
        <a href="/main-page/cards/card">Add new Card</a>
        <button type="submit" name="action" value="submit">Submit</button>
    </form>
</body>
</html>
